name: Build Feature Login
on:
  push:
    branches: [feature-deployment]
    paths:
      - '../../src/features/feature-login/**'
  workflow_dispatch:

jobs:
  call-template:
    uses: ./.github/workflows/build-release-template.yml
    with:
      feature-path: 'features/feature-login'
      feature-name: 'feature-login'