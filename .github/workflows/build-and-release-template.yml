name: Build & Deploy Feature for JSDelivr

on:
  workflow_call:
    inputs:
      feature-path:
        required: true
        type: string
      feature-name:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      VITE_GITHUB_USER:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd ${{ inputs.feature-path }}
          npm ci

      # 4️⃣ Build feature
      - name: Build feature
        run: |
          cd ${{ inputs.feature-path }}
          echo "VITE_GITHUB_USER=${{ secrets.VITE_GITHUB_USER }}" >> .env
          npm run build

      # 5️⃣ Determine dist path
      - name: Determine dist path
        id: dist-path
        run: |
          if [ "${{ inputs.feature-name }}" == "app-shell" ]; then
            echo "DIST_PATH=dist" >> $GITHUB_OUTPUT
          else
            echo "DIST_PATH=${{ inputs.feature-path }}/dist" >> $GITHUB_OUTPUT
          fi
          echo "✅ Dist path is $DIST_PATH"

      # 6️⃣ Prepare JSDelivr branch (safe)
      - name: Prepare JSDelivr branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch remote branch if exists
          git fetch origin build-dist || true

          # Checkout existing build-dist or create new
          if git show-ref --quiet refs/heads/build-dist; then
            git checkout build-dist
          else
            git checkout -b build-dist
          fi

          # Ensure centralized folder for JSDelivr
          mkdir -p jsdelivr-dist/${{ inputs.feature-name }}

          # Copy the newly built feature into jsdelivr-dist/<feature-name>
          cp -r ${{ steps.dist-path.outputs.DIST_PATH }}/* jsdelivr-dist/${{ inputs.feature-name }}/

          # Add new or updated files
          git add -f jsdelivr-dist/${{ inputs.feature-name }}

          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Build ${{ inputs.feature-name }} for JSDelivr [skip ci]"
          else
            echo "✅ No changes to commit for ${{ inputs.feature-name }}"
          fi

      # 7️⃣ Push to build-dist branch
      - name: Push to build-dist branch
        run: |
          git push -u origin build-dist --force