name: Build & Deploy Feature for JSDelivr

on:
  workflow_call:
    inputs:
      feature-path:
        required: true
        type: string
      feature-name:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      VITE_GITHUB_USER:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd ${{ inputs.feature-path }}
          npm ci

      # 4️⃣ Build feature
      - name: Build feature
        run: |
          cd ${{ inputs.feature-path }}
          echo "VITE_GITHUB_USER=${{ secrets.VITE_GITHUB_USER }}" >> .env
          npm run build

      # 5️⃣ Determine dist path
      - name: Determine dist path
        id: dist-path
        run: |
          if [ "${{ inputs.feature-name }}" == "app-shell" ]; then
            echo "DIST_PATH=dist" >> $GITHUB_OUTPUT
          else
            echo "DIST_PATH=${{ inputs.feature-path }}/dist" >> $GITHUB_OUTPUT
          fi

      # 6️⃣ Prepare cumulative JSDelivr branch
      - name: Prepare JSDelivr branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and checkout or create build-dist
          git fetch origin build-dist || true
          if git show-ref --quiet refs/heads/build-dist; then
            git checkout build-dist
            git merge origin/build-dist --allow-unrelated-histories -m "Merge remote build-dist"
          else
            git checkout -b build-dist
          fi

          # Create folder for this feature
          mkdir -p jsdelivr-dist/${{ inputs.feature-name }}
          cp -r ${{ steps.dist-path.outputs.DIST_PATH }}/* jsdelivr-dist/${{ inputs.feature-name }}/

          # Commit only if there are changes
          git add -f jsdelivr-dist/${{ inputs.feature-name }}
          if ! git diff --cached --quiet; then
            git commit -m "Build ${{ inputs.feature-name }} for JSDelivr [skip ci]"
          else
            echo "✅ No changes to commit for ${{ inputs.feature-name }}"
          fi

      # 7️⃣ Push cumulative branch
      - name: Push cumulative build-dist branch
        run: |
          git push origin build-dist