name: Build & Release Template

on:
  workflow_call:
    inputs:
      feature-path:
        required: true
        type: string
      feature-name:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      VITE_GITHUB_USER:
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository using PAT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd ${{ inputs.feature-path }}
          npm ci

      # 4️⃣ Build feature
      - name: Build feature
        run: |
          cd ${{ inputs.feature-path }}
          echo "VITE_GITHUB_USER=${{ secrets.VITE_GITHUB_USER }}" >> .env
          npm run build

      # 5️⃣ Create version tag
      - name: Create version tag
        id: tag
        run: |
          VERSION=v$(date +'%Y%m%d%H%M')
          git tag ${{ inputs.feature-name }}-$VERSION
          git push origin ${{ inputs.feature-name }}-$VERSION
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 6️⃣ Create GitHub release
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.feature-name }}-${{ steps.tag.outputs.version }}
          name: Build ${{ inputs.feature-name }} ${{ steps.tag.outputs.version }}
          files: |
            ${{ inputs.feature-path }}/dist/**

      # 7️⃣ Build & Test Docker image (only for app-shell)
      - name: Build & Test Docker Image
        if: ${{ inputs.feature-name == 'app-shell' }}
        working-directory: ${{ github.workspace }}  # repo root
        run: |
          echo "🔹 Building Docker image..."
          docker build -f Dockerfile -t letter-jam-frontend:latest .
          echo "✅ Docker image built successfully"

          echo "🔹 Running Docker image test..."
          docker run --rm letter-jam-frontend:latest
          echo "✅ Docker image ran successfully"