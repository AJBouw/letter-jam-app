name: Build & Release Template

on:
  workflow_call:
    inputs:
      feature-path:
        required: true
        type: string
      feature-name:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      VITE_GITHUB_USER:
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd ${{ inputs.feature-path }}
          npm ci

      # 4️⃣ Build feature
      - name: Build feature
        run: |
          cd ${{ inputs.feature-path }}
          echo "VITE_GITHUB_USER=${{ secrets.VITE_GITHUB_USER }}" >> .env
          npm run build

      # 5️⃣ Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.feature-name }}-dist
          path: ${{ inputs.feature-path }}/dist

      # 6️⃣ Optional: Build & Test Docker image (only for app-shell)
      - name: Build Docker Image
        if: ${{ inputs.feature-name == 'app-shell' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/app-shell/Dockerfile
          push: false
          tags: letter-jam-frontend:latest
          load: true

      - name: Test Docker Image
        if: ${{ inputs.feature-name == 'app-shell' }}
        run: |
          echo "🔹 Starting Docker container for test..."
          docker run --rm -d --name test-nginx letter-jam-frontend:latest
          sleep 5
          echo "🔹 Checking container health..."
          if ! curl -f http://localhost:80; then
            echo "Frontend did not start properly"
            exit 1
          fi
          docker stop test-nginx
          echo "✅ Docker image test completed successfully"