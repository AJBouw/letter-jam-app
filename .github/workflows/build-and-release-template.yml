name: Build & Release Template

on:
  workflow_call:
    inputs:
      feature-path:
        required: true
        type: string
      feature-name:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      VITE_GITHUB_USER:
        required: true

permissions:
  contents: write

jobs:
  build-docker-from-artifacts:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository (needed for Docker context)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Get latest run IDs for each workflow
      - name: Get latest workflow run IDs
        id: latest_runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflows = {
              appShell: 'build-app-shell.yml',
              featureHome: 'build-feature-home.yml',
              featureLogin: 'build-feature-login.yml',
              featureQuickGame: 'build-feature-quick-game.yml'
            };

            const runIds = {};

            for (const [key, workflowFile] of Object.entries(workflows)) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                status: 'success',
                per_page: 1
              });
              if (!runs.data.workflow_runs.length) {
                console.warn(`No successful runs found for workflow ${workflowFile}`);
                runIds[key] = null;
              } else {
                runIds[key] = runs.data.workflow_runs[0].id;
              }
            }

            return runIds;

      # 3️⃣ Download artifacts safely (skip missing)
      - name: Download Artifacts
        run: |
          mkdir -p app-shell/dist
          mkdir -p features/feature-home/dist
          mkdir -p features/feature-login/dist
          mkdir -p features/feature-quick-game/dist

      - name: Download App Shell
        if: ${{ steps.latest_runs.outputs.appShell != null }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_runs.outputs.appShell }}
          path: app-shell/dist
          name: app-shell-dist

      - name: Download Feature Home
        if: ${{ steps.latest_runs.outputs.featureHome != null }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_runs.outputs.featureHome }}
          path: features/feature-home/dist
          name: feature-home-dist

      - name: Download Feature Login
        if: ${{ steps.latest_runs.outputs.featureLogin != null }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_runs.outputs.featureLogin }}
          path: features/feature-login/dist
          name: feature-login-dist

      - name: Download Feature Quick Game
        if: ${{ steps.latest_runs.outputs.featureQuickGame != null }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest_runs.outputs.featureQuickGame }}
          path: features/feature-quick-game/dist
          name: feature-quick-game-dist

      # 4️⃣ Build Docker image (copy only prebuilt artifacts)
      - name: Build Docker image
        run: |
          docker build -t letter-jam-frontend:latest -f src/app-shell/Dockerfile .

      # 5️⃣ Optional: Test container
      - name: Run Docker container
        run: |
          docker run -d -p 8080:80 --name letter-jam-frontend-test letter-jam-frontend:latest
          sleep 5
          if ! curl -f http://localhost:8080; then
            echo "Frontend did not start properly"
            exit 1
          fi
          docker rm -f letter-jam-frontend-test
