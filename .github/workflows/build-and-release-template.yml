name: Build & Release Template

on:
  workflow_call:
    inputs:
      feature-path:
        required: true
        type: string
      feature-name:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true
      VITE_GITHUB_USER:
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository using PAT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd ${{ inputs.feature-path }}
          npm ci

      # 4️⃣ Build feature
      - name: Build feature
        run: |
          cd ${{ inputs.feature-path }}
          echo "VITE_GITHUB_USER=${{ secrets.VITE_GITHUB_USER }}" >> .env
          npm run build

      # 5️⃣ Create version tag
      - name: Create version tag
        id: tag
        run: |
          VERSION=v$(date +'%Y%m%d%H%M')
          git tag ${{ inputs.feature-name }}-$VERSION
          git push origin ${{ inputs.feature-name }}-$VERSION
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 6️⃣ Create GitHub release
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.feature-name }}-${{ steps.tag.outputs.version }}
          name: Build ${{ inputs.feature-name }} ${{ steps.tag.outputs.version }}
          files: |
            ${{ inputs.feature-path }}/dist/**

      # 7️⃣ Build Docker image (only for app-shell)
      - name: 🏗️ Build Docker Image (app-shell only)
        if: ${{ inputs.feature-name == 'app-shell' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: letter-jam-frontend:latest

      # 8️⃣ Run Docker image test with timeout (prevents infinite hang)
      - name: 🧪 Run Docker Image Test
        if: ${{ inputs.feature-name == 'app-shell' }}
        timeout-minutes: 2
        run: |
          echo "🔹 Starting container..."
          docker run -d -p 8080:80 --name test-app letter-jam-frontend:latest

          echo "⏳ Waiting for container to start..."
          sleep 5

          echo "🔍 Checking app availability..."
          if ! curl -fs http://localhost:8080 > /dev/null; then
            echo "❌ App not reachable, showing logs..."
            docker logs test-app || true
            docker stop test-app || true
            docker rm test-app || true
            exit 1
          fi

          echo "✅ App reachable — test passed!"
          docker stop test-app
          docker rm test-app