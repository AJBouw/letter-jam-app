name: Build Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo (needed for Docker context)
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Download artifacts for all features
      - name: Download Feature Home
        uses: actions/download-artifact@v4
        with:
          name: feature-home-dist
          path: features/feature-home/dist

      - name: Download Feature Login
        uses: actions/download-artifact@v4
        with:
          name: feature-login-dist
          path: features/feature-login/dist

      - name: Download Feature Quick Game
        uses: actions/download-artifact@v4
        with:
          name: feature-quick-game-dist
          path: features/feature-quick-game/dist

      - name: Download App Shell
        uses: actions/download-artifact@v4
        with:
          name: app-shell-dist
          path: app-shell/dist

      # 3️⃣ Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/app-shell/Dockerfile
          load: true
          tags: letter-jam-frontend:latest

      # 4️⃣ Optional: run container test
      - name: Test Docker Image
        run: |
          docker run --rm -d --name test-nginx -p 8081:80 letter-jam-frontend:latest
          sleep 5
          docker logs test-nginx
          docker stop test-nginx